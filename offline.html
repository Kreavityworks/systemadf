<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>SystemADF · Offline</title><style>body{margin:0;background:#f5f5f3;color:#111;font:16px system-ui;min-height:100dvh;display:grid;place-items:center}main{max-width:360px;padding:28px;text-align:center}img{width:200px;max-width:80%;margin-bottom:24px}h1{font-size:28px}p{color:#666;line-height:1.6}button{font:inherit;font-weight:600;background:#111;color:white;border:0;border-radius:24px;padding:14px 28px;cursor:pointer}</style></head><body><main><img src="/app-icons/icon-192.png" alt="SystemADF"><h1 id="title">You’re offline</h1><p id="message">Reconnect to load your team’s latest data.</p><button id="retry" onclick="location.reload()">Try again</button></main><script>if((localStorage.getItem('adf_language_v1')||navigator.language).startsWith('id')){document.documentElement.lang='id';document.getElementById('title').textContent='Koneksi terputus';document.getElementById('message').textContent='Hubungkan internet untuk memuat data terbaru tim.';document.getElementById('retry').textContent='Coba lagi';}</script></body></html>
